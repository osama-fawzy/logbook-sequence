<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d62">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Logbook Sequence</title>
<style>
  :root{--navy:#0b3d62;--bg:#eef3f8;--line:#d5dde5;--on:#1b8a3a;--off:#b3261e;--wa:#1fa855}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#1c2630;
       padding-bottom:env(safe-area-inset-bottom)}
  header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  header h1{margin:0;font-size:1.2rem}
  .who{font-size:.82rem;color:#cfe3f5;margin-top:2px;overflow-wrap:anywhere}
  nav{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
  nav button{all:unset;color:#cfe3f5;font-size:.88rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{margin:0 0 4px;font-size:1.15rem}
  label{display:block;font-weight:600;margin:14px 0 6px;font-size:.92rem}
  label small{font-weight:400;color:#6a7783}
  input[type=text],input[type=date],input[type=tel],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:#fff;color:inherit}
  input:focus,select:focus{outline:2px solid #7fb2dc;border-color:#7fb2dc}
  .row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
  .seg{display:flex;gap:10px}
  .seg input{position:absolute;opacity:0}
  .seg label{flex:1;margin:0;text-align:center;padding:12px;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-weight:700}
  .seg input[value=ON]:checked+label{background:var(--on);border-color:var(--on);color:#fff}
  .seg input[value=OFF]:checked+label{background:var(--off);border-color:var(--off);color:#fff}
  .seg input:focus-visible+label{outline:2px solid #7fb2dc}
  .btn{display:block;width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
  .btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);margin-top:10px}
  .btn.wa{background:var(--wa);margin-top:10px}
  .btn.small{display:inline-block;width:auto;padding:8px 14px;margin:8px 8px 0 0;font-size:.9rem}
  .err{background:#fdecea;border:1px solid #f3b8b3;color:#8a1f17;border-radius:8px;padding:10px 14px;margin-bottom:12px}
  .err p{margin:4px 0}
  .info{background:#eaf4ff;border:1px solid #bcd7f2;color:#0b3d62;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.92rem}
  .me{background:#f2f6fa;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  .me b{display:block;font-size:1.05rem;overflow-wrap:anywhere}.me span{color:#6a7783;font-size:.9rem}
  .pill{padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:.8rem}
  .pill.ON{background:var(--on)}.pill.OFF{background:var(--off)}
  .ok{color:var(--on);font-size:2.4rem;text-align:center;margin:0}
  dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;margin:12px 0 0}
  dt{color:#6a7783}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  .hist{border-bottom:1px solid var(--line);padding:12px 0}
  .hist:last-child{border:0}
  .hist small{color:#6a7783;display:block;margin-top:2px}
  nav button#nav-handover{background:#fff;color:var(--navy);padding:4px 14px;border-radius:99px;text-decoration:none;font-weight:700}
  .pill.New{background:var(--on)}.pill.Used{background:#b26a00}
  dd.pre{white-space:pre-line}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .pick{display:block;width:100%;text-align:left;padding:12px 38px 12px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:1rem;font-family:inherit;color:inherit;cursor:pointer;position:relative}
  .pick::after{content:'\25BE';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#6a7783}
  .pick.empty{color:#6a7783}
  .pick:focus-visible{outline:2px solid #7fb2dc}
  .holist{margin-top:14px}
  .holist .title{font-weight:600;font-size:.92rem;margin-bottom:6px}
  .holist .total{font-weight:700;text-align:right;color:var(--navy);margin-top:2px}
  .horow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f2f6fa;margin-bottom:8px;overflow-wrap:anywhere}
  .horow .x{all:unset;cursor:pointer;color:var(--off);font-weight:700;padding:4px 10px;font-size:1.05rem}
  .horow .x:focus-visible{outline:2px solid #7fb2dc}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
  .opt{padding:14px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1rem;font-weight:700;color:#1c2630;cursor:pointer;font-family:inherit}
  .opt[aria-checked=true]{background:var(--navy);border-color:var(--navy);color:#fff}
  .opt:focus-visible{outline:2px solid #7fb2dc}
  .sheet-actions{display:flex;gap:10px}.sheet-actions .btn{flex:1;margin-top:10px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <h1>Logbook Sequence</h1>
  <div class="who" id="who" hidden><span id="who-name"></span></div>
  <nav id="nav" hidden>
    <button type="button" id="nav-new">New entry</button>
    <button type="button" id="nav-handover">Handover</button>
    <button type="button" id="nav-history">History</button>
    <button type="button" id="nav-edit">Edit my details</button>
  </nav>
</header>

<main>

  <!-- ===== First-time registration ===== -->
  <section id="screen-register" hidden>
    <form id="reg-form" class="card" autocomplete="off" novalidate>
      <h2>Registration</h2>
      <div class="info">Enter your name and mobile number once. They are saved on this phone and added to every PDF automatically.</div>
      <div class="err" id="reg-errors" hidden></div>

      <label for="reg-name">Full name</label>
      <input type="text" id="reg-name" maxlength="100" autocomplete="name" required>

      <label for="reg-phone">Mobile number (WhatsApp)</label>
      <input type="tel" id="reg-phone" placeholder="01012345678  or  +971501234567" inputmode="tel" autocomplete="tel" required>

      <button type="submit" class="btn">Save &rarr; Continue</button>
    </form>
  </section>

  <!-- ===== Entry form ===== -->
  <section id="screen-form" hidden>
    <form id="entry-form" class="card" autocomplete="off" novalidate>
      <div class="err" id="form-errors" hidden></div>

      <label>User</label>
      <div class="me"><b id="me-name"></b><span id="me-phone"></span></div>

      <div class="row">
        <div>
          <label for="f-date">Date</label>
          <input type="date" id="f-date" required>
        </div>
        <div>
          <label for="f-ac">A/C</label>
          <select id="f-ac" required></select>
        </div>
      </div>

      <label for="f-book">Book Type</label>
      <select id="f-book" required></select>

      <div class="row">
        <div>
          <label for="f-from">S/N From</label>
          <input type="text" id="f-from" required autocapitalize="characters">
        </div>
        <div>
          <label for="f-to">S/N To</label>
          <input type="text" id="f-to" required autocapitalize="characters">
        </div>
      </div>

      <label>Status</label>
      <div class="seg" id="f-status"></div>

      <button type="submit" class="btn">Submit &rarr; PDF &rarr; WhatsApp</button>
    </form>
  </section>

  <!-- ===== After submit ===== -->
  <section id="screen-done" hidden>
    <div class="card">
      <p class="ok">&#10003;</p>
      <h2 style="text-align:center">PDF ready</h2>
      <dl id="done-details"></dl>
      <div class="info" id="done-msg">Choose the group <b>Logbook_Sequence</b> in the share list and press send.</div>
      <button type="button" class="btn wa" id="btn-share">Share PDF to WhatsApp (Logbook_Sequence)</button>
      <button type="button" class="btn alt" id="btn-download">Download PDF</button>
      <button type="button" class="btn alt" id="btn-new">New entry</button>
    </div>
  </section>

  <!-- ===== History ===== -->
  <section id="screen-history" hidden>
    <div class="card">
      <h2>History</h2>
      <div id="hist-list"></div>
    </div>
  </section>

  <!-- ===== Handover ===== -->
  <section id="screen-handover" hidden>
    <form id="ho-form" class="card" autocomplete="off" novalidate>
      <h2>Handover</h2>
      <div class="err" id="ho-errors" hidden></div>
      <button type="button" class="btn alt" id="ho-new">Create New List</button>

      <label>User</label>
      <div class="me"><b id="ho-me-name"></b><span id="ho-me-phone"></span></div>

      <div class="row">
        <div>
          <label for="h-date">Date</label>
          <input type="date" id="h-date" required>
        </div>
        <div>
          <label for="h-ac">A/C</label>
          <select id="h-ac" required></select>
        </div>
      </div>

      <label for="h-book">Book Type</label>
      <select id="h-book" required></select>
      <div class="info" id="ho-lock" hidden></div>

      <div class="row">
        <div>
          <label for="h-from">S/N From</label>
          <input type="text" id="h-from" autocapitalize="characters">
        </div>
        <div>
          <label for="h-to">S/N To</label>
          <input type="text" id="h-to" autocapitalize="characters">
        </div>
      </div>
      <button type="button" class="btn alt" id="ho-add">Add</button>

      <div class="holist" id="ho-list"></div>

      <label>Status</label>
      <button type="button" class="pick empty" id="ho-status">Select status</button>

      <button type="button" class="btn" id="ho-send">Send to</button>
      <button type="button" class="btn alt" id="ho-cancel">Cancel</button>
    </form>
  </section>

  <!-- ===== Handover received (opened from the link in WhatsApp) ===== -->
  <section id="screen-receive" hidden>
    <div class="card">
      <h2>Handover list</h2>
      <div class="err" id="rc-errors" hidden></div>
      <dl id="rc-details"></dl>
      <div class="info" id="rc-msg" hidden></div>
      <button type="button" class="btn wa" id="rc-confirm">Confirm Receive</button>
      <button type="button" class="btn alt" id="rc-cancel">Cancel</button>
    </div>
  </section>

</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet">
    <h2 id="modal-title"></h2>
    <div class="opts" id="modal-opts" role="radiogroup"></div>
    <div class="sheet-actions">
      <button type="button" class="btn alt" id="modal-cancel">Cancel</button>
      <button type="button" class="btn" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<script>
/* One-time cleanup: remove the old installed-app service worker and its cache */
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
    }
    if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
  }catch(e){}
})();
</script>
<script src="app.js"></script>
</body>
</html>
